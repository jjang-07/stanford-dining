<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  (function () {
    var t = "light";
    try { t = localStorage.getItem("diningTheme") === "dark" ? "dark" : "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Stanford Dining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f3efe6;
    --card: #fffdf9;
    --ink: #2e2d29;
    --muted: #5f5c55;
    --faint: #77736a;
    --line: rgba(46, 45, 41, .12);
    --fill: rgba(120, 108, 84, .1);
    --fill-strong: rgba(120, 108, 84, .18);
    --cardinal: #8c1515;
    --accent: #8c1515;
    --on-accent: #ffffff;
    --hl-bg: #f4e3df;
    --hl-ink: #8c1515;
    --veg-bg: #dcefe8;
    --veg-ink: #00584a;
    --glass: rgba(243, 239, 230, .78);
    --shadow: 0 1px 2px rgba(80, 30, 20, .06), 0 12px 28px -14px rgba(80, 30, 20, .18);
    --pop: 0 2px 6px rgba(60, 20, 10, .1), 0 24px 48px -16px rgba(60, 20, 10, .3);
    --ease: cubic-bezier(.32, .72, 0, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hanken Grotesk", system-ui, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #2b1819;
    --card: #3a2225;
    --ink: #f7f0e6;
    --muted: #d3c4b6;
    --faint: #b9a99b;
    --line: rgba(247, 240, 230, .14);
    --fill: rgba(247, 240, 230, .08);
    --fill-strong: rgba(247, 240, 230, .16);
    --accent: #d2c295;
    --on-accent: #2e2d29;
    --hl-bg: rgba(210, 194, 149, .18);
    --hl-ink: #e8d9ad;
    --veg-bg: rgba(0, 150, 118, .28);
    --veg-ink: #8fe3cb;
    --glass: rgba(43, 24, 25, .8);
    --shadow: 0 0 0 1px rgba(247, 240, 230, .06), 0 12px 28px -14px rgba(0, 0, 0, .5);
    --pop: 0 0 0 1px rgba(247, 240, 230, .1), 0 24px 48px -12px rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; accent-color: var(--cardinal); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; transition: transform .25s var(--ease), background-color .25s var(--ease), color .2s, box-shadow .25s var(--ease); }
  button:active { transform: scale(.96); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  a { color: inherit; text-underline-offset: 3px; }

  .page {
    position: relative; max-width: 1200px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; }
  .brand-mark { width: 42px; height: 42px; flex: none; border-radius: 12px; box-shadow: var(--shadow); }
  .brand-name { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .brand-sub { display: block; font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.2; margin-top: 1px; }
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .theme-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--ink); }
  .theme-btn svg { width: 20px; height: 20px; }
  .theme-btn .moon { display: none; }
  :root[data-theme="dark"] .meal[aria-selected="true"] { background: var(--fill-strong); box-shadow: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .moon { display: block; }
  .specials-link {
    display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; text-decoration: none; color: var(--on-accent); background: var(--accent);
    transition: transform .25s var(--ease);
  }
  .specials-link:active { transform: scale(.96); }

  /* Header */
  .kicker { color: var(--muted); font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  h1 {
    font-size: clamp(34px, 8.4vw, 60px);
    line-height: 1.03;
    letter-spacing: -0.035em;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
  }
  .summary { margin: 16px 0 0; max-width: 720px; font-size: clamp(17px, 2.3vw, 21px); line-height: 1.4; letter-spacing: -0.012em; text-wrap: pretty; }
  .summary b { font-weight: 600; }
  .summary .dd { color: var(--muted); }
  .summary .lead { display: block; }
  .summary .next { display: block; margin-top: 6px; font-size: 16px; color: var(--muted); letter-spacing: 0; }

  /* Controls: sticky glass bar */
  .controls {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px;
    margin: 24px calc(-1 * max(20px, env(safe-area-inset-left))) 0;
    padding: calc(10px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
    background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid transparent;
  }
  .days { display: flex; gap: 2px; }
  .day {
    width: 46px; height: 58px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    color: var(--muted);
  }
  .day .dow { font-size: 12px; font-weight: 500; }
  .day .num { font-size: 18px; font-weight: 600; }
  @media (hover: hover) { .day:hover:not([aria-pressed="true"]) { background: var(--fill); } }
  .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .day.today:not([aria-pressed="true"]) .num { color: var(--ink); }
  .day.today .num::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 2px auto 0; }
  .day[aria-pressed="true"].today .num::after { background: var(--on-accent); }

  .meals { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--fill); }
  .meal { flex: 1; min-height: 38px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--muted); }
  @media (hover: hover) { .meal:hover:not([aria-selected="true"]) { color: var(--ink); } }
  .meal[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 0 0 .5px rgba(0, 0, 0, .04); }

  /* Chips and filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; align-items: center; }
  .filters .lbl { color: var(--muted); font-size: 14px; margin-right: 4px; }
  .chip { min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--card); box-shadow: var(--shadow); }
  @media (hover: hover) { .chip:hover { background: var(--fill-strong); } }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Hall picker */
  .hallpick { position: relative; margin-top: 18px; display: inline-block; }
  .hp-btn { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--card); box-shadow: var(--shadow); }
  .hp-btn[aria-expanded="true"] { background: var(--fill-strong); }
  .hp-panel {
    position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; width: min(300px, calc(100vw - 40px));
    background: var(--card); border-radius: 20px; padding: 8px; box-shadow: var(--pop);
    transform-origin: top left; animation: pop .28s var(--ease);
  }
  .hp-panel[hidden] { display: none; }
  .hp-panel label { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; font-size: 16px; cursor: pointer; border-radius: 12px; }
  @media (hover: hover) { .hp-panel label:hover { background: var(--fill); } }
  .hp-panel input { width: 20px; height: 20px; margin: 0; }
  .hp-actions { display: flex; gap: 8px; padding: 6px 4px 2px; border-top: 1px solid var(--line); margin-top: 6px; }
  .hp-actions button { flex: 1; min-height: 40px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .hp-actions button:hover { background: var(--fill); }

  /* Hall cards */
  .halls { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; margin-top: 24px; align-items: start; }
  .hall { background: var(--card); border-radius: 26px; padding: 22px 20px 10px; box-shadow: var(--shadow); }
  .hall-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
  .hall h2 { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .none { color: var(--muted); padding: 14px 0 20px; margin: 0; border-top: 1px solid var(--line); font-size: 15px; }
  .hall-title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; }

  .dishes { list-style: none; margin: 0; padding: 0; }
  .dishes li { border-top: 1px solid var(--line); }
  .dishes li:first-child { border-top: 0; }

  .sec { margin-top: 4px; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; width: 100%; margin: 0; padding: 14px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); text-align: left; letter-spacing: .01em; }
  .sec-head.toggle { min-height: 44px; align-items: center; }
  @media (hover: hover) { .sec-head.toggle:hover { color: var(--ink); } }
  .sec-count { color: var(--accent); font-weight: 500; }
  .sec + .sec { border-top: 1px solid var(--line); margin-top: 8px; }
  .sec-main { background: var(--fill); border-radius: 18px; padding: 0 14px 4px; margin: 0 -6px 14px; border-top: 0 !important; }
  .sec-main .sec-head { padding-top: 12px; color: var(--ink); }
  .sec-main .dishes li { border-top-color: var(--line); }
  .sec-main .dish-name { font-size: 17.5px; font-weight: 600; letter-spacing: -0.015em; }

  .dish { width: 100%; text-align: left; padding: 12px 0; display: block; border-radius: 12px; }
  .dish:active { transform: none; background: var(--fill); }
  .dish-name { font-size: 16px; font-weight: 500; line-height: 1.3; text-wrap: pretty; }
  .tags { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 5px; margin-top: 6px; }
  .tag { flex: none; white-space: nowrap; font-size: 12px; font-weight: 500; line-height: 1; padding: 5px 8px; border-radius: 7px; background: var(--fill); color: var(--muted); }
  .tag.vegan { background: var(--veg-bg); color: var(--veg-ink); }
  .tag.hl { background: var(--hl-bg); color: var(--hl-ink); font-weight: 600; }
  .tag.only { background: transparent; color: var(--hl-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .detail { display: none; padding: 0 0 14px; font-size: 14px; color: var(--muted); }
  .detail.open { display: block; animation: rise .3s var(--ease); }
  .detail p { margin: 0 0 8px; }
  .detail b { color: var(--ink); font-weight: 600; }

  /* Highlights */
  .highlights { margin-top: 28px; }
  .hl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hl-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .hl-toggle { min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; background: var(--card); box-shadow: var(--shadow); }
  .hl-toggle[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); }
  .hl-picker { margin: 12px 0 8px; padding: 20px 18px 10px; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
  .hl-picker:not([hidden]) { animation: rise .35s var(--ease); }
  .hl-picker[hidden] { display: none; }
  .pick-group { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  .pick-group legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 10px; }
  .pick-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { position: relative; display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 14px; border-radius: 13px; background: var(--fill); cursor: pointer; font-size: 15px; transition: background-color .2s var(--ease), transform .25s var(--ease); user-select: none; }
  .pick:active { transform: scale(.97); }
  .pick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .pick .box { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; transition: background-color .2s var(--ease), border-color .2s; }
  .pick .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg) scale(0); transition: transform .25s var(--ease); }
  .pick.on { background: var(--hl-bg); }
  .pick.on .box { background: var(--accent); border-color: var(--accent); }
  .pick.on .box::after { transform: translateY(-1px) rotate(-45deg) scale(1); }
  .pick input:focus-visible ~ .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick .pc { font-size: 12px; color: var(--muted); }
  .pick-actions { display: flex; justify-content: flex-end; padding-bottom: 4px; }
  .pick-actions button { font-size: 14px; font-weight: 500; color: var(--accent); min-height: 40px; padding: 0 8px; }
  .hl-none { color: var(--muted); font-size: 15px; margin: 14px 0 0; }
  .hl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .hl-row:first-child { border-top: 0; }
  #hlRows { margin-top: 6px; }
  .hl-label { width: 120px; flex: none; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .hl-empty { color: var(--muted); font-size: 14px; }
  .hl-note { flex-basis: 100%; margin: 2px 0 0 130px; color: var(--muted); font-size: 13px; max-width: 620px; }
  .hl-chip { display: flex; flex-direction: column; text-align: left; font-size: 14px; line-height: 1.3; padding: 9px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); color: var(--muted); max-width: 340px; }
  .hl-chip b { font-weight: 600; color: var(--ink); }
  .hl-chip .sd { color: var(--muted); font-size: 13px; }
  .hl-chip.here { background: var(--hl-bg); box-shadow: none; }
  .hl-chip.here b { color: var(--hl-ink); }
  .hl-chip.guess { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 14px; }
  .hl-chip.guess.here { box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* Nutrition */
  .nutrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 0; }
  .nutrow .nut-note { flex: 0 0 100%; margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .nutrow .nut-note span { display: block; max-width: 640px; }
  .nutrow .nut-note a { color: var(--muted); }
  .nut { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); }
  .nut b { color: var(--ink); font-weight: 600; }
  .sec-main .nut { font-size: 13.5px; }
  .best { background: var(--fill); border-radius: 18px; padding: 0 14px 12px; margin: 4px -6px 14px; }
  .best .sec-head { color: var(--ink); padding-top: 12px; }
  .best-list { list-style: none; margin: 0; padding: 0; }
  .best-list li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .best-list li:first-child { border-top: 0; }
  .best-list .bn { font-weight: 600; min-width: 0; }
  .best-list .bv { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .best-list .bv b { color: var(--ink); font-weight: 600; }
  .best-list .bt { margin-left: 6px; font-size: 11px; color: var(--veg-ink); background: var(--veg-bg); padding: 3px 7px; border-radius: 6px; font-weight: 500; }
  .best-pair { margin: 8px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .best-pair b { color: var(--ink); font-weight: 600; }

  .foot { margin-top: 44px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .empty-all { margin-top: 36px; color: var(--muted); font-size: 18px; }

  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .first .hall { animation: rise .6s var(--ease) both; }
  .first .hall:nth-child(2) { animation-delay: .05s; }
  .first .hall:nth-child(3) { animation-delay: .1s; }
  .first .hall:nth-child(4) { animation-delay: .15s; }
  .first .hall:nth-child(n+5) { animation-delay: .2s; }

  @media (max-width: 640px) {
    .specials-link .long { display: none; }
    .brand-name { font-size: 18px; }
    .controls { flex-direction: column; align-items: stretch; gap: 10px; }
    .days { width: 100%; justify-content: space-between; }
    .day { width: auto; flex: 1; height: 56px; }
    .meals { width: 100%; }
    .meal { padding: 0 8px; }
    .hl-label { width: 100%; }
    .hl-note { margin-left: 0; }
    .hall { border-radius: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Stanford Dining home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#8c1515"/>
        <circle cx="32" cy="32" r="12" fill="none" stroke="#fff" stroke-width="4"/>
        <circle cx="32" cy="32" r="5" fill="#fff"/>
        <g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M10 14v10a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V14M13 14v36"/>
          <path d="M54 50V14c-4 3-6 9-6 15v7h6"/>
        </g>
      </svg>
      <span><span class="brand-name">Stanford Dining</span><span class="brand-sub">For Fat F*cks</span></span>
    </a>
    <div class="actions">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <a class="specials-link" href="specials.html"><span class="long">Dining Hall&nbsp;</span>Specials</a>
    </div>
  </header>
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="summary" id="summary" aria-live="polite"></p>

  <div class="controls">
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <div class="meals" id="meals" role="tablist" aria-label="Meal"></div>
  </div>

  <section class="highlights" aria-label="Highlights">
    <div class="hl-head">
      <h2 class="hl-title">Highlights this week</h2>
      <button class="hl-toggle" id="hlToggle" aria-expanded="false" aria-controls="hlPicker"></button>
    </div>
    <div class="hl-picker" id="hlPicker" hidden></div>
    <div id="hlRows"></div>
  </section>

  <div class="hallpick" id="hallpick">
    <button class="hp-btn" id="hpBtn" aria-expanded="false" aria-controls="hpPanel"></button>
    <div class="hp-panel" id="hpPanel" role="group" aria-label="Dining halls" hidden></div>
  </div>

  <div class="filters" id="filters" role="group" aria-label="Dietary filters"></div>
  <div class="nutrow" id="nutrow" role="group" aria-label="Nutrition estimates"></div>

  <div class="halls" id="halls" aria-live="polite"></div>

  <div class="foot">
    <span id="updated"></span>
    <span>Menus from <a href="https://rdeapps.stanford.edu/dininghallmenu/">Stanford R&amp;DE</a>. Allergen details can change, so check at the hall.</span>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;
const ALL_HALLS = DATA.halls;
const HL = Object.fromEntries(DATA.highlights.map(h => [h.id, h]));

const TZ = "America/Los_Angeles";
const MEAL_ORDER = ["Breakfast", "Brunch", "Lunch", "Dinner"];
const FILTERS = [
  { id: "unique", label: "Only here", test: d => d.unique },
  { id: "vegan", label: "Vegan", test: d => d.tags.includes("vegan") },
  { id: "vegetarian", label: "Vegetarian", test: d => d.tags.includes("vegetarian") || d.tags.includes("vegan") },
  { id: "gf", label: "Gluten-free", test: d => d.tags.includes("gf") },
  { id: "halal", label: "Halal", test: d => d.tags.includes("halal") },
];
const TAG_LABEL = { vegan: "vegan", vegetarian: "vegetarian", gf: "gluten-free", halal: "halal" };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

// Current time in Pacific, independent of the visitor's timezone
function pacificNow() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", hour12: false,
  }).formatToParts(new Date());
  const g = t => +parts.find(p => p.type === t).value;
  return { key: `${g("month")}/${g("day")}/${g("year")}`, hour: g("hour") % 24 };
}

const parseDate = s => { const [m, d, y] = s.split("/").map(Number); return new Date(y, m - 1, d); };
const mealsFor = day => MEAL_ORDER.filter(m => DATA.halls.some(h => (day.menus[h.id] || {})[m]));

function defaultMeal(day, hour) {
  const avail = mealsFor(day);
  const pref = hour < 10 ? ["Breakfast", "Brunch", "Lunch", "Dinner"]
             : hour < 14 ? ["Brunch", "Lunch", "Dinner"]
             : ["Dinner", "Lunch", "Brunch"];
  return pref.find(m => avail.includes(m)) || avail[0] || null;
}

const now = pacificNow();
let dayIdx = Math.max(0, DATA.days.findIndex(d => d.date === now.key));
const STORE_KEY = "diningHighlights.v1";
const DEFAULT_PICKS = ["steak", "korean", "pho"];
function loadPicks() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(v)) return { ids: v.filter(id => HL[id]), saved: true };
  } catch (e) {}
  return { ids: DEFAULT_PICKS.filter(id => HL[id]), saved: false };
}
function savePicks() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...state.selected])); } catch (e) {} }
const NUT_KEY = "diningNutrition.v1";
function loadNut() {
  try { const v = JSON.parse(localStorage.getItem(NUT_KEY)); if (v && typeof v === "object") return { on: !!v.on, cals: v.cals !== false, high: !!v.high }; } catch (e) {}
  return { on: false, cals: true, high: false };
}
function saveNut() { try { localStorage.setItem(NUT_KEY, JSON.stringify(state.nut)); } catch (e) {} }
const HALL_KEY = "diningHalls.v1";
const DEFAULT_HALLS = ["Arrillaga", "Wilbur", "Lakeside", "FlorenceMoore"];
function loadHalls() {
  const ids = ALL_HALLS.map(h => h.id);
  try {
    const v = JSON.parse(localStorage.getItem(HALL_KEY));
    if (Array.isArray(v)) return new Set(v.filter(id => ids.includes(id)));
  } catch (e) {}
  return new Set(DEFAULT_HALLS.filter(id => ids.includes(id)));
}
function saveHalls() { try { localStorage.setItem(HALL_KEY, JSON.stringify([...state.halls])); } catch (e) {} }
const applyHalls = () => { DATA.halls = ALL_HALLS.filter(h => state.halls.has(h.id)); };
const picks = loadPicks();
const state = { day: DATA.days[dayIdx], meal: null, filters: new Set(), open: new Set(), extras: new Set(),
                selected: new Set(picks.ids), halls: loadHalls(), picker: !picks.saved, nut: loadNut() };
applyHalls();
state.meal = defaultMeal(state.day, now.hour);

function renderHallPick() {
  const n = state.halls.size;
  $("hpBtn").textContent = `Dining halls (${n} of ${ALL_HALLS.length}) ▾`;
  $("hpPanel").innerHTML = ALL_HALLS.map(h =>
    `<label><input type="checkbox" data-hall="${esc(h.id)}"${state.halls.has(h.id) ? " checked" : ""}> ${esc(h.name)}</label>`).join("")
    + `<div class="hp-actions"><button type="button" id="hpAll">Select all</button><button type="button" id="hpNone">Clear</button></div>`;
}

function hallsChanged() {
  saveHalls(); applyHalls();
  if (!mealsFor(state.day).includes(state.meal)) state.meal = defaultMeal(state.day, now.hour);
  renderHallPick(); renderAll();
}

function renderHeader() {
  const dt = parseDate(state.day.date);
  const isToday = state.day.date === now.key;
  $("kicker").textContent = isToday ? "Today at your dining halls" : "Dining halls";
  $("title").textContent = dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

function renderDays() {
  $("days").innerHTML = DATA.days.map((d, i) => {
    const dt = parseDate(d.date);
    const sel = d === state.day;
    return `<button class="day ${d.date === now.key ? "today" : ""}" data-i="${i}" aria-pressed="${sel}" aria-label="${dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}">
      <span class="dow">${dt.toLocaleDateString("en-US", { weekday: "short" })}</span>
      <span class="num">${dt.getDate()}</span></button>`;
  }).join("");
}

function renderMeals() {
  const avail = mealsFor(state.day);
  $("meals").innerHTML = avail.map(m =>
    `<button class="meal" role="tab" data-m="${m}" aria-selected="${m === state.meal}">${m}</button>`
  ).join("");
}

function renderNutRow() {
  const n = state.nut;
  let html = `<button class="chip" data-n="on" aria-pressed="${n.on}">Nutrition estimates</button>`;
  if (n.on) {
    html += `<button class="chip" data-n="high" aria-pressed="${n.high}">${proteinThr()} g+ protein</button>`
         + `<button class="chip" data-n="cals" aria-pressed="${n.cals}">Show calories</button>`
         + `<p class="nut-note"><span>Rough estimates for one typical serving, worked out from dish names. Stanford doesn't publish nutrition for these menus, so treat these as a way to compare options, not exact numbers. Questions about food and nutrition: <a href="mailto:nutritionist@stanford.edu">nutritionist@stanford.edu</a>.</span></p>`;
  }
  $("nutrow").innerHTML = html;
}

function renderFilters() {
  $("filters").innerHTML = `<span class="lbl">Show only</span>` + FILTERS.map(f =>
    `<button class="chip" data-f="${f.id}" aria-pressed="${state.filters.has(f.id)}">${f.label}</button>`
  ).join("");
}

// A dish is "unique" if no other hall in your list serves the same dish in this meal
function markUnique() {
  const counts = {};
  DATA.halls.forEach(h => {
    const seen = new Set(((state.day.menus[h.id] || {})[state.meal] || []).map(d => d.name.trim().toLowerCase()));
    seen.forEach(n => { counts[n] = (counts[n] || 0) + 1; });
  });
  DATA.halls.forEach(h => ((state.day.menus[h.id] || {})[state.meal] || []).forEach(d => {
    d.unique = counts[d.name.trim().toLowerCase()] === 1;
  }));
}

const MIN_SCORE = 5;  // grams of protein per 100 kcal (after nudging fried/creamy dishes down)
const isBreakfast = () => state.meal === "Breakfast" || state.meal === "Brunch";
const proteinThr = () => isBreakfast() ? 12 : 20;
const filtering = () => state.filters.size > 0 || (state.nut.on && state.nut.high);

function matches(d) {
  if (state.nut.on && state.nut.high && !(d.n && d.n[1] >= proteinThr())) return false;
  return [...state.filters].every(id => FILTERS.find(f => f.id === id).test(d));
}

const nutLine = d => d.n
  ? `<span class="nut"><b>≈${d.n[1]} g</b> protein${state.nut.cals ? `, ≈${d.n[0]} cal` : ""}</span>` : "";

// "Best picks": estimated protein per calorie, with fried, creamy, and fatty dishes nudged down
function bestPicks(items) {
  const thr = isBreakfast() ? 10 : 15;
  const seen = new Map();
  items.forEach(x => {
    const d = x.d;
    if (!d.n || d.station || d.n[1] < thr || d.score < MIN_SCORE) return;
    if (!(d.cat === "main" || d.cat === "protein" || d.n[1] >= 20)) return;
    if (!seen.has(d.name)) seen.set(d.name, x);
  });
  const ranked = [...seen.values()].sort((a, b) => b.d.score - a.d.score);
  const top = ranked.slice(0, 3);
  const plant = ranked.find(x => !top.includes(x) && (x.d.tags.includes("vegan") || x.d.tags.includes("vegetarian")));
  const veg = items.filter(x => x.d.cat === "veg" && x.d.n && x.d.n[0] <= 150 && !x.d.heavy)
    .sort((a, b) => (a.d.staple - b.d.staple) || (b.d.n[1] - a.d.n[1]) || (a.d.n[0] - b.d.n[0]))[0];
  return { top, plant, veg };
}

function bestHTML(items) {
  const { top, plant, veg } = bestPicks(items);
  if (!top.length) return "";
  const row = (x, tag) => `<li><span class="bn">${esc(x.d.name)}${tag ? `<span class="bt">${tag}</span>` : ""}</span>
    <span class="bv"><b>≈${x.d.n[1]} g</b> protein${state.nut.cals ? `, ≈${x.d.n[0]} cal` : ""}</span></li>`;
  const pair = veg ? `<p class="best-pair">Pair with <b>${esc(veg.d.name)}</b>${state.nut.cals ? ` (≈${veg.d.n[0]} cal)` : ""}</p>` : "";
  return `<div class="sec best"><h3 class="sec-head">Best picks</h3><ul class="best-list">${top.map(x => row(x)).join("")}${plant ? row(plant, "plant-based") : ""}</ul>${pair}</div>`;
}

function dishHTML(hallId, d, i) {
  const key = `${hallId}|${state.day.date}|${state.meal}|${i}`;
  const open = state.open.has(key);
  const diet = d.tags.includes("vegan") ? "vegan" : d.tags.includes("vegetarian") ? "vegetarian" : "";
  const tags = (d.hl || []).filter(id => state.selected.has(id)).map(id => `<span class="tag hl">${esc(HL[id].tag)}</span>`).join("")
             + (d.unique && !state.filters.has("unique") && DATA.halls.length > 1 ? `<span class="tag only">only here</span>` : "")
             + (diet ? `<span class="tag ${diet}">${diet}</span>` : "");
  const bits = [];
  bits.push(`<p><b>Diet</b> ${d.tags.length ? d.tags.map(t => TAG_LABEL[t]).join(", ") : "no dietary tags"}</p>`);
  if (state.nut.on && d.n) bits.push(`<p><b>Estimate per serving</b> ${state.nut.cals ? `${d.n[0]} cal, ` : ""}${d.n[1]} g protein, ${d.n[2]} g fat, ${d.n[3]} g carbs. Rough guess from the dish name and a typical portion.</p>`);
  if (d.description) bits.push(`<p>${esc(d.description)}</p>`);
  if (d.ingredients) bits.push(`<p><b>Ingredients</b> ${esc(d.ingredients)}</p>`);
  bits.push(`<p><b>Contains</b> ${d.allergens ? esc(d.allergens.toLowerCase()) : "none of the major allergens"}</p>`);
  if (d.shared) bits.push(`<p><b>Shared equipment</b> ${esc(d.shared.toLowerCase())}</p>`);
  return `<li>
    <button class="dish" data-k="${esc(key)}" aria-expanded="${open}">
      <span class="dish-name">${esc(d.name)}</span>
      ${state.nut.on ? nutLine(d) : ""}
      ${tags ? `<span class="tags">${tags}</span>` : ""}
    </button>
    <div class="detail ${open ? "open" : ""}">${bits.join("")}</div>
  </li>`;
}

const SECTIONS = [
  { id: "main", label: "Mains" },
  { id: "protein", label: "More protein" },
  { id: "veg", label: "Veggies" },
  { id: "other", label: "Sides and extras" },
];

function renderHalls() {
  if (!state.meal) { $("halls").innerHTML = ""; return; }
  markUnique();
  $("halls").innerHTML = DATA.halls.map(h => {
    const all = (state.day.menus[h.id] || {})[state.meal] || [];
    if (!all.length) {
      return `<section class="hall"><div class="hall-head"><h2>${esc(h.name)}</h2></div>
        <p class="none">Not serving ${state.meal.toLowerCase()}</p></section>`;
    }
    const shown = all.map((d, i) => ({ d, i })).filter(x => matches(x.d));
    const count = filtering() ? `${shown.length} of ${all.length}` : "";
    const hlIds = [...new Set(all.flatMap(d => d.hl || []))].filter(id => state.selected.has(id));
    const body = !shown.length
      ? `<p class="none">${state.filters.size === 1 && state.filters.has("unique") ? "Nothing exclusive to this hall" : "Nothing matches these filters"}</p>`
      : (state.nut.on ? bestHTML(shown) : "") + SECTIONS.map(sec => {
          const items = shown.filter(x => x.d.cat === sec.id);
          if (!items.length) return "";
          const collapsible = sec.id === "other" && !filtering();
          const key = `${h.id}|${state.day.date}|${state.meal}`;
          const expanded = state.extras.has(key);
          const list = collapsible && !expanded ? ""
            : `<ul class="dishes">${items.map(x => dishHTML(h.id, x.d, x.i)).join("")}</ul>`;
          const head = collapsible
            ? `<button class="sec-head toggle" data-x="${esc(key)}" aria-expanded="${expanded}"><span>${sec.label}</span><span class="sec-count">${expanded ? "Hide" : "Show " + items.length}</span></button>`
            : `<h3 class="sec-head">${sec.label}</h3>`;
          return `<div class="sec sec-${sec.id}">${head}${list}</div>`;
        }).join("");
    return `<section class="hall"><div class="hall-head"><div class="hall-title"><h2>${esc(h.name)}</h2>${hlIds.map(id => `<span class="tag hl">${esc(HL[id].tag)}</span>`).join("")}</div>${count ? `<span class="count">${count}</span>` : ""}</div>${body}</section>`;
  }).join("");
}

function highlightMatches(id) {
  // One entry per day and meal, listing every hall that has it
  const groups = new Map();
  DATA.days.forEach((day, di) => MEAL_ORDER.forEach(m => DATA.halls.forEach(h => {
    const dishes = ((day.menus[h.id] || {})[m] || []).filter(d => (d.hl || []).includes(id));
    if (!dishes.length) return;
    const key = `${di}|${m}`;
    if (!groups.has(key)) groups.set(key, { di, meal: m, halls: [], dishes: [] });
    const g = groups.get(key);
    g.halls.push(h.name);
    g.dishes.push(...dishes.map(d => d.name));
  })));
  return [...groups.values()];
}

const dayNameFor = (di, meal) => DATA.days[di].date === now.key ? (meal === "Dinner" ? "Tonight" : "Today") : parseDate(DATA.days[di].date).toLocaleDateString("en-US", { weekday: "short" });
const weekdayLong = di => parseDate(DATA.days[di].date).toLocaleDateString("en-US", { weekday: "long" });
const joinList = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const selectedList = () => DATA.highlights.filter(h => state.selected.has(h.id));

function renderHighlights() {
  if (!state.selected.size) {
    $("hlRows").innerHTML = `<p class="hl-none">Nothing selected yet. Choose foods above and they'll show up here.</p>`;
    return;
  }
  $("hlRows").innerHTML = selectedList().map(h => {
    const hits = highlightMatches(h.id);
    const guesses = DATA.unconfirmed.filter(u => u.id === h.id)
      .map(u => ({ di: DATA.days.findIndex(d => d.date === u.date), hall: u.hall }));
    const chips = hits.map(s => {
      const uniq = [...new Set(s.dishes)];
      const extra = uniq.length > 2 ? `, +${uniq.length - 2} more` : "";
      const isTonight = DATA.days[s.di].date === now.key && s.meal === "Dinner";
      return `<button class="hl-chip ${DATA.days[s.di] === state.day ? "here" : ""}" data-di="${s.di}" data-m="${s.meal}">
        <span><b>${dayNameFor(s.di, s.meal)}${isTonight ? "" : " " + s.meal.toLowerCase()}</b> at ${esc(joinList(s.halls))}</span>
        <span class="sd">${esc(uniq.slice(0, 2).join(", "))}${extra}</span></button>`;
    }).join("") + guesses.map(g => `<button class="hl-chip guess ${DATA.days[g.di] === state.day ? "here" : ""}" data-di="${g.di}">
        <span><b>${dayNameFor(g.di)}</b> at ${esc(g.hall)}</span><span class="sd">Usual day, unconfirmed</span></button>`).join("");
    return `<div class="hl-row"><span class="hl-label">${esc(h.label)}</span>${chips || `<span class="hl-empty">None on the menu this week</span>`}
      ${h.note ? `<p class="hl-note">${esc(h.note)}</p>` : ""}</div>`;
  }).join("");
}

function pickCount(id) {
  const days = new Set(highlightMatches(id).map(s => s.di)).size;
  if (days) return { text: String(days), title: `${days} day${days > 1 ? "s" : ""} this week` };
  const g = DATA.unconfirmed.filter(u => u.id === id).length;
  return g ? { text: "~" + g, title: `${g} likely day${g > 1 ? "s" : ""}, not confirmed` } : { text: "0", title: "Not on the menu this week" };
}

function renderPicker() {
  const groups = {};
  DATA.highlights.forEach(h => (groups[h.group] = groups[h.group] || []).push(h));
  $("hlPicker").innerHTML = Object.entries(groups).map(([g, items]) =>
    `<fieldset class="pick-group"><legend>${esc(g)}</legend><div class="pick-grid">${items.map(h => {
      const on = state.selected.has(h.id), c = pickCount(h.id);
      return `<label class="pick ${on ? "on" : ""}"><input type="checkbox" value="${h.id}" ${on ? "checked" : ""}>
        <span class="box" aria-hidden="true"></span><span class="pl">${esc(h.label)}</span><span class="pc" title="${c.title}">${c.text}</span></label>`;
    }).join("")}</div></fieldset>`).join("")
    + `<div class="pick-actions"><button type="button" id="hlClear">Clear all</button></div>`;
}

function renderToggle() {
  const n = state.selected.size;
  $("hlToggle").textContent = state.picker ? "Done" : (n ? `Choose foods (${n})` : "Choose foods");
  $("hlToggle").setAttribute("aria-expanded", state.picker);
  $("hlPicker").hidden = !state.picker;
}

// ---- Summary sentence, based on the foods the visitor picked
const mealWord = (m, di) => (DATA.days[di].date === now.key && m === "Dinner") ? "tonight" : "for " + m.toLowerCase();

function dayClauses(di) {
  const out = [];
  selectedList().forEach(h => {
    const byMeal = new Map();
    MEAL_ORDER.forEach(m => DATA.halls.forEach(hall => {
      const dishes = ((DATA.days[di].menus[hall.id] || {})[m] || []).filter(d => (d.hl || []).includes(h.id));
      if (!dishes.length) return;
      if (!byMeal.has(m)) byMeal.set(m, { halls: [], dishes: [] });
      const e = byMeal.get(m);
      e.halls.push(hall.name);
      e.dishes.push(...dishes.map(d => d.name));
    }));
    if (byMeal.size) out.push({ h, byMeal });
  });
  return out;
}

function clauseHTML(c, di, withDishes) {
  const parts = [...c.byMeal].map(([m, e]) => `${esc(joinList(e.halls))} ${mealWord(m, di)}`);
  let detail = "";
  if (withDishes) {
    const dishes = [...new Set([...c.byMeal.values()].flatMap(e => e.dishes))].map(n => n.replace(/\s*\([^)]*\)/g, ""));
    if (!(dishes.length === 1 && dishes[0].toLowerCase() === c.h.short.toLowerCase())) {
      const shown = dishes.slice(0, 2);
      const rest = dishes.length - shown.length;
      detail = ` <span class="dd">with ${esc(joinList(shown))}${rest > 0 ? `, plus ${rest} more` : ""}</span>`;
    }
  }
  return `<b>${esc(c.h.short)}</b> at ${parts.join(", and at ")}${detail}`;
}

function renderSummary() {
  const el = $("summary");
  if (!state.selected.size) {
    el.innerHTML = `<span class="lead">Choose the foods you love and this line will tell you where they're showing up.</span>`;
    return;
  }
  const di = DATA.days.indexOf(state.day);
  const isToday = state.day.date === now.key;
  const when = isToday ? "today" : "on " + weekdayLong(di);
  const clauses = dayClauses(di);
  const guesses = DATA.unconfirmed.filter(u => u.date === state.day.date && state.selected.has(u.id) && !clauses.some(c => c.h.id === u.id));
  const withDishes = clauses.length + guesses.length <= 2;
  const items = clauses.slice(0, 3).map(c => clauseHTML(c, di, withDishes))
    .concat(guesses.map(g => `<b>${esc(HL[g.id].short)}</b> may be at ${esc(g.hall)} <span class="dd">(usual day, unconfirmed)</span>`));
  const more = clauses.length > 3 ? `; plus ${clauses.length - 3} more below` : "";
  const lead = items.length
    ? `${isToday ? "Today" : weekdayLong(di)}: ${items.join("; ")}${more}.`
    : `Nothing from your highlights ${when}.`;

  let next = "";
  for (let k = di + 1; k < DATA.days.length && !next; k++) {
    const cs = dayClauses(k);
    if (!cs.length) continue;
    const c = cs[0], [m, e] = [...c.byMeal][0];
    next = `Next up: ${esc(c.h.short)} at ${esc(joinList(e.halls))} on ${weekdayLong(k)} ${mealWord(m, k)}.`;
  }
  el.innerHTML = `<span class="lead">${lead}</span>${next ? `<span class="next">${next}</span>` : ""}${topProteinLine()}`;
}

function topProteinLine() {
  if (!state.nut.on || !state.meal) return "";
  const thr = isBreakfast() ? 10 : 20;
  const byName = new Map();
  DATA.halls.forEach(h => ((state.day.menus[h.id] || {})[state.meal] || []).forEach(d => {
    if (!d.n || d.staple || d.station || d.score < MIN_SCORE || d.n[1] < thr || !(d.cat === "main" || d.cat === "protein")) return;
    if (!byName.has(d.name)) byName.set(d.name, { d, halls: [] });
    byName.get(d.name).halls.push(h.name);
  }));
  const best = [...byName.values()].sort((a, b) => b.d.score - a.d.score)[0];
  if (!best) return "";
  const cal = state.nut.cals ? `, ≈${best.d.n[0]} cal` : "";
  return `<span class="next">Top protein pick for ${state.meal.toLowerCase()}: <b>${esc(best.d.name)}</b> at ${esc(joinList(best.halls))} (≈${best.d.n[1]} g protein${cal}).</span>`;
}

function renderUpdated() {
  const g = new Date(DATA.generated);
  $("updated").textContent = "Updated " + g.toLocaleString("en-US", {
    timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit",
  }).replace(",", "") + " Pacific";
}

function renderAll() { renderHeader(); renderSummary(); renderDays(); renderMeals(); renderFilters(); renderNutRow(); renderHighlights(); renderHalls(); }

document.addEventListener("change", e => {
  const hb = e.target.closest("[data-hall]");
  if (hb) { hb.checked ? state.halls.add(hb.dataset.hall) : state.halls.delete(hb.dataset.hall); return hallsChanged(); }
  const cb = e.target.closest(".pick input");
  if (!cb) return;
  cb.checked ? state.selected.add(cb.value) : state.selected.delete(cb.value);
  cb.closest(".pick").classList.toggle("on", cb.checked);
  savePicks(); renderToggle(); renderSummary(); renderHighlights(); renderHalls();
});

document.addEventListener("click", e => {
  const hp = $("hpPanel");
  if (e.target.closest("#hpBtn")) { hp.hidden = !hp.hidden; $("hpBtn").setAttribute("aria-expanded", !hp.hidden); return; }
  if (e.target.closest("#hpAll")) { ALL_HALLS.forEach(h => state.halls.add(h.id)); return hallsChanged(); }
  if (e.target.closest("#hpNone")) { state.halls.clear(); return hallsChanged(); }
  if (!e.target.closest("#hallpick")) { hp.hidden = true; $("hpBtn").setAttribute("aria-expanded", "false"); }
  const nb = e.target.closest("[data-n]");
  if (nb) {
    const k = nb.dataset.n;
    state.nut[k] = !state.nut[k];
    saveNut(); renderNutRow(); renderSummary(); return renderHalls();
  }
  if (e.target.closest("#hlToggle")) { state.picker = !state.picker; return renderToggle(); }
  if (e.target.closest("#hlClear")) {
    state.selected.clear(); savePicks(); renderPicker(); renderToggle(); renderSummary(); renderHighlights(); return renderHalls();
  }
  const sc = e.target.closest(".hl-chip");
  if (sc) {
    state.day = DATA.days[+sc.dataset.di];
    const avail = mealsFor(state.day);
    state.meal = sc.dataset.m && avail.includes(sc.dataset.m) ? sc.dataset.m : (avail.includes(state.meal) ? state.meal : defaultMeal(state.day, now.hour));
    return renderAll();
  }
  const ex = e.target.closest(".sec-head.toggle");
  if (ex) { const k = ex.dataset.x; state.extras.has(k) ? state.extras.delete(k) : state.extras.add(k); return renderHalls(); }
  const day = e.target.closest(".day");
  if (day) {
    state.day = DATA.days[+day.dataset.i];
    if (!mealsFor(state.day).includes(state.meal)) state.meal = defaultMeal(state.day, now.hour);
    return renderAll();
  }
  const meal = e.target.closest(".meal");
  if (meal) { state.meal = meal.dataset.m; renderMeals(); renderNutRow(); renderSummary(); return renderHalls(); }
  const chip = e.target.closest(".chip");
  if (chip) {
    const id = chip.dataset.f;
    state.filters.has(id) ? state.filters.delete(id) : state.filters.add(id);
    renderFilters(); return renderHalls();
  }
  const dish = e.target.closest(".dish");
  if (dish) {
    const k = dish.dataset.k;
    const open = !state.open.has(k);
    open ? state.open.add(k) : state.open.delete(k);
    dish.setAttribute("aria-expanded", open);
    dish.nextElementSibling.classList.toggle("open", open);
  }
});

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("diningTheme", t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === "dark" ? "#2b1819" : "#f3efe6";
  $("themeBtn").setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
$("themeBtn").addEventListener("click", () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
applyTheme(document.documentElement.getAttribute("data-theme"));
document.documentElement.classList.add("first");
setTimeout(() => document.documentElement.classList.remove("first"), 1200);
renderHallPick();
renderPicker();
renderToggle();
renderAll();
renderUpdated();
</script>
</body>
</html>
