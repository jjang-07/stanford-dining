<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dining Hall Specials · Stanford Dining</title>
<style>
  :root { --bg: #f6f7f9; --ink: #13171e; --muted: #6d7582; --line: #e2e5ea; --card: #fff; --cardinal: #8c1515; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  .back { color: var(--muted); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--ink); }
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 18px 0 6px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
  iframe { width: 100%; height: 760px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); }
  .open { display: inline-block; margin-top: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; }
  .open:hover { border-color: var(--cardinal); color: var(--cardinal); }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="./">← Back to menus</a>
  <h1>Dining Hall Specials</h1>
  <p>Chef's specials, themed dinners and pop-ups are announced on Stanford Dining's Instagram. Latest posts below.</p>
  <iframe src="https://www.instagram.com/stanforddining/embed" title="Stanford Dining on Instagram" loading="lazy" scrolling="yes" allowtransparency="true"></iframe>
  <br>
  <a class="open" href="https://www.instagram.com/stanforddining/" target="_blank" rel="noopener">Open on Instagram ↗</a>
</main>
</body>
</html>
