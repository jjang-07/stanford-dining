<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  (function () {
    var t = "light";
    try { t = localStorage.getItem("diningTheme") === "dark" ? "dark" : "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dining Hall Specials · Stanford Dining</title>
<style>
  :root { color-scheme: light; --bg: #f3efe6; --ink: #2e2d29; --muted: #5f5c55; --card: #fffdf9; --accent: #8c1515; --on-accent: #fff; --shadow: 0 1px 2px rgba(80,30,20,.06), 0 12px 28px -14px rgba(80,30,20,.18); }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #2b1819; --ink: #f7f0e6; --muted: #d3c4b6; --card: #3a2225; --accent: #d2c295; --on-accent: #2e2d29; --shadow: 0 0 0 1px rgba(247,240,230,.08); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
  .page { max-width: 640px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  .back { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-size: 16px; font-weight: 500; text-decoration: none; }
  h1 { font-size: clamp(34px, 8.4vw, 48px); letter-spacing: -0.035em; line-height: 1.05; font-weight: 700; margin: 8px 0 10px; text-wrap: balance; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; text-wrap: pretty; }
  iframe { width: 100%; height: 760px; border: 0; border-radius: 26px; background: var(--card); box-shadow: var(--shadow); }
  .open { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; padding: 0 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 15px; font-weight: 600; }
  .back:focus-visible, .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="./">← Back to menus</a>
  <h1>Dining Hall Specials</h1>
  <p>Chef's specials, themed dinners and pop-ups are announced on Stanford Dining's Instagram. Latest posts below.</p>
  <iframe src="https://www.instagram.com/stanforddining/embed" title="Stanford Dining on Instagram" loading="lazy" scrolling="yes" allowtransparency="true"></iframe>
  <br>
  <a class="open" href="https://www.instagram.com/stanforddining/" target="_blank" rel="noopener">Open on Instagram ↗</a>
</main>
</body>
</html>
